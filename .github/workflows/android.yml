# Builds an installable Android APK of the mobile app and attaches it to the run.
# Started by hand: Actions -> "Build Android app" -> Run workflow.
#
# The APK is signed with the standard debug key, which is fine for installing on your
# own phone and not accepted by Google Play. For a store release, sign with your own key.
name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Attach the APK
        uses: actions/upload-artifact@v4
        with:
          name: articulate-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
